<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registo - CinePIS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#e50914',
                        'primary-hover': '#f40612',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in',
                        'slide-up': 'slideUp 0.3s ease-out',
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        html, body {
            overflow-x: hidden;
            max-width: 100%;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col">
    <script src="/js/loader.js"></script>
    <main class="flex-1 flex items-center justify-center p-4">
    <div class="bg-gray-800/90 backdrop-blur-sm rounded-xl p-8 w-full max-w-md border border-gray-700 shadow-2xl animate-slide-up">
        <h2 class="text-3xl font-bold mb-6 text-center bg-gradient-to-r from-white to-gray-300 bg-clip-text text-transparent flex items-center justify-center gap-2">
            <i class="bi bi-person-plus"></i> Criar Conta
        </h2>
        <form id="registerForm">
            <div class="mb-4">
                <input type="text" id="name" placeholder="O teu Nome" required
                       class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-primary transition-all">
            </div>
            <div class="mb-4">
                <input type="email" id="email" placeholder="Email" required
                       class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-primary transition-all">
            </div>
            <div class="mb-4">
                <input type="password" id="password" placeholder="Password" required
                       class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-primary transition-all">
            </div>
            <button type="submit" class="w-full px-4 py-3 bg-primary hover:bg-primary-hover rounded-lg font-semibold transition-all hover:scale-105 shadow-lg flex items-center justify-center gap-2">
                <i class="bi bi-person-plus"></i> Registar
            </button>
        </form>

        <div class="relative my-6">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-gray-600"></div>
            </div>
            <div class="relative flex justify-center text-sm">
                <span class="px-2 bg-gray-800 text-gray-400">ou</span>
            </div>
        </div>

        <button class="w-full px-4 py-3 bg-[#db4437] hover:bg-[#c23321] rounded-lg font-semibold transition-all hover:scale-105 mb-4 flex items-center justify-center gap-2" id="googleRegisterBtn">
            <i class="bi bi-google"></i> Registar com Google
        </button>

        <div class="text-center text-sm text-gray-400 mt-4">
            Já tens conta?
            <a href="login.html" class="text-primary hover:text-red-300 font-semibold underline decoration-white/20 hover:decoration-primary/60 transition-colors">Faz Login aqui</a>
        </div>
    </div>
    </main>

    <footer class="border-t border-white/10 bg-black/40 backdrop-blur-xl">
        <div class="container mx-auto px-4 py-8 max-w-md">
            <div class="flex flex-col gap-2">
            <div class="flex items-center justify-between">
                <div class="text-sm font-extrabold tracking-wide">
                    <span class="text-white">CINE</span><span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-red-300">PIS</span>
                </div>
                <div class="text-xs text-gray-500">© <span id="footerYear"></span></div>
                </div>
                <div class="text-xs text-gray-500 text-center">Desenvolvido por David Fernandes & João Rôlo & Sorin Revenco</div>
            </div>
        </div>
        <script>document.getElementById('footerYear') && (document.getElementById('footerYear').textContent = new Date().getFullYear());</script>
    </footer>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-gray-800 border border-gray-700 rounded-lg shadow-2xl p-4 transform translate-y-[150%] transition-transform duration-300 z-50 max-w-sm w-[calc(100vw-2rem)]">
        <div class="flex items-center gap-3">
            <div id="toast-icon" class="text-2xl flex-shrink-0"></div>
            <div class="min-w-0">
                <p id="toast-message" class="font-semibold break-words"></p>
            </div>
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script>
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');
            
            toastMessage.textContent = message;
            
            const icons = {
                success: '✓',
                error: '✕',
                info: 'ℹ'
            };
            
            toastIcon.textContent = icons[type] || icons.info;
            toastIcon.className = `text-2xl ${type === 'success' ? 'text-green-400' : type === 'error' ? 'text-red-400' : 'text-blue-400'}`;
            
            toast.classList.remove('translate-y-[150%]');
            setTimeout(() => {
                toast.classList.add('translate-y-[150%]');
            }, 3000);
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    showToast('Conta criada com sucesso!', 'success');
                    setTimeout(() => window.location.href = 'login.html', 1500);
                } else {
                    showToast('Erro: ' + data.error, 'error');
                }
            } catch (err) {
                showToast('Erro ao tentar registar.', 'error');
            }
        });

        window.onload = async function() {
            const btn = document.getElementById('googleRegisterBtn');
            if (!btn) return;

            try {
                const res = await fetch('/auth/google/client-id');
                const data = await res.json();
                const clientId = String(data.clientId || '').trim();

                if (!clientId) {
                    btn.disabled = true;
                    btn.classList.add('opacity-50', 'cursor-not-allowed');
                    btn.title = 'Registo com Google não configurado no servidor';
                    return;
                }

                if (typeof google === 'undefined') {
                    btn.disabled = true;
                    btn.classList.add('opacity-50', 'cursor-not-allowed');
                    btn.title = 'Google SDK não carregou';
                    return;
                }

                google.accounts.id.initialize({
                    client_id: clientId,
                    callback: handleGoogleSignIn
                });

                btn.addEventListener('click', () => {
                    google.accounts.id.prompt();
                });
            } catch (err) {
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                btn.title = 'Erro ao inicializar registo Google';
            }
        };

        async function handleGoogleSignIn(response) {
            try {
                const res = await fetch('/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: response.credential })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showToast('Conta criada / login com Google OK!', 'success');
                    setTimeout(() => window.location.href = '/', 1000);
                } else {
                    showToast('Erro: ' + data.error, 'error');
                }
            } catch (err) {
                showToast('Erro ao registar com Google', 'error');
            }
        }
    </script>
</body>
</html>
