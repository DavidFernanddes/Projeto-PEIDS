<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diretor - CinePIS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#e50914',
                        'primary-hover': '#f40612',
                        success: '#46d369',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in',
                        'slide-up': 'slideUp 0.3s ease-out',
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        html, body { overflow-x: hidden; max-width: 100%; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <script src="/js/loader.js"></script>
    <nav class="bg-black/95 backdrop-blur-sm sticky top-0 z-50 border-b border-gray-800 shadow-lg">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center gap-6">
            <div class="flex items-center gap-6">
                <a href="/" class="group flex items-center select-none">
                    <span class="leading-tight transition-all duration-200 group-hover:scale-[1.02] group-hover:brightness-110">
                        <span class="block text-lg sm:text-xl font-extrabold tracking-wide">
                            <span class="text-white">CINE</span>
                            <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-red-300">PIS</span>
                        </span>
                        <span class="hidden sm:block text-xs text-gray-400 -mt-0.5">Filmes & Séries</span>
                    </span>
                </a>
                <div class="hidden md:flex items-center gap-2">
                    <a href="/pages/frontoffice/atores.html" class="px-3 py-2 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-gray-200 transition-colors text-sm font-semibold flex items-center gap-2">
                        <svg class="w-4 h-4 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        Atores
                    </a>
                    <a href="/pages/frontoffice/diretores.html" class="px-3 py-2 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-gray-200 transition-colors text-sm font-semibold flex items-center gap-2">
                        <svg class="w-4 h-4 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        Diretores
                    </a>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <a href="/pages/frontoffice/diretores.html" class="text-gray-300 hover:text-white transition-all hover:scale-105 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Voltar
                </a>
                <div id="nav-menu" class="flex items-center gap-4"></div>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <div id="loading" class="text-center text-gray-400 animate-pulse py-10">A carregar...</div>

        <div id="directorCard" class="hidden bg-gray-800/90 backdrop-blur-sm rounded-xl p-6 md:p-8 mb-8 border border-gray-700 flex flex-col md:flex-row gap-6 shadow-2xl animate-fade-in">
            <div class="w-full md:w-64 flex-shrink-0">
                <img id="photo" src="" alt="Foto" class="w-full rounded-lg shadow-2xl object-contain bg-gray-900">
            </div>
            <div class="flex-1">
                <h1 id="name" class="text-3xl md:text-4xl font-bold mb-2 bg-gradient-to-r from-white to-gray-300 bg-clip-text text-transparent">Diretor</h1>
                <p id="birth" class="text-gray-400 text-sm mb-4"></p>
                <p id="bioLang" class="text-xs text-gray-500 mb-2"></p>
                <p id="bio" class="text-gray-300 leading-relaxed"></p>
            </div>
        </div>

        <div class="bg-gray-800/90 backdrop-blur-sm rounded-xl p-6 border border-gray-700 shadow-2xl animate-slide-up">
            <h2 class="text-2xl font-bold mb-4 flex items-center gap-2">
                <svg class="w-6 h-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                Filmografia
            </h2>
            <div id="contentsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
        </div>
    </div>

    <script src="/js/nav.js"></script>
    <script>
        function escapeHtml(str) {
            return String(str || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function getParam(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }

        function renderContentCard(item, index) {
            const year = item.release_date ? new Date(item.release_date).getFullYear() : '';
            const typeLabel = item.type === 'series' ? 'Série' : 'Filme';
            return `
                <a href="/pages/frontoffice/detalhes.html?id=${item.id}" class="bg-gray-800 rounded-lg overflow-hidden border border-gray-700 hover:border-primary transition-all hover:scale-105 hover:shadow-2xl group animate-slide-up" style="animation-delay:${index * 0.03}s">
                    <div class="aspect-[2/3] bg-gray-900 overflow-hidden">
                        <img src="${item.poster_path || '/img/placeholder-poster.svg'}" alt="${escapeHtml(item.title)}" class="w-full h-full object-cover">
                    </div>
                    <div class="p-3">
                        <p class="text-sm font-semibold truncate group-hover:text-primary transition-colors">${escapeHtml(item.title)}</p>
                        <p class="text-xs text-gray-400">${typeLabel}${year ? ' • ' + year : ''}</p>
                    </div>
                </a>
            `;
        }

        async function loadDirector() {
            const id = getParam('id');
            if (!id) {
                document.getElementById('loading').className = 'text-center text-red-400 py-10';
                document.getElementById('loading').innerText = 'ID não fornecido.';
                return;
            }

            try {
                const res = await fetch(`/api/diretores/${encodeURIComponent(id)}`);
                if (!res.ok) throw new Error('Diretor não encontrado');
                const data = await res.json();

                document.title = `${data.name} - CinePIS`;
                document.getElementById('photo').src = data.profile_path || '/img/placeholder-person.svg';
                document.getElementById('name').innerText = data.name || 'Diretor';
                document.getElementById('birth').innerText = data.birth_date ? `Nascimento: ${new Date(data.birth_date).toLocaleDateString('pt-PT')}` : '';
                document.getElementById('bio').innerText = data.biography || 'Sem biografia disponível.';
                const bioLang = document.getElementById('bioLang');
                if (bioLang) {
                    bioLang.innerText = data.biography_language === 'en-US'
                        ? 'Biografia disponível apenas em inglês (TMDB).'
                        : '';
                }

                const grid = document.getElementById('contentsGrid');
                const contents = Array.isArray(data.contents) ? data.contents : [];
                if (!contents.length) {
                    grid.innerHTML = '<div class="col-span-full text-center text-gray-400 py-10">Sem conteúdos associados.</div>';
                } else {
                    grid.innerHTML = contents.map((c, i) => renderContentCard(c, i)).join('');
                }

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('directorCard').classList.remove('hidden');
            } catch (e) {
                console.error(e);
                document.getElementById('loading').className = 'text-center text-red-400 py-10';
                document.getElementById('loading').innerText = 'Erro ao carregar diretor.';
            }
        }

        loadDirector();
    </script>

    <footer class="mt-16 border-t border-white/10 bg-black/40 backdrop-blur-xl">
        <div class="container mx-auto px-4 py-10 max-w-6xl">
            <div class="flex flex-col md:flex-row gap-8 md:items-center md:justify-between">
                <div>
                    <div class="text-lg font-extrabold tracking-wide">
                        <span class="text-white">CINE</span><span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-red-300">PIS</span>
                    </div>
                    <p class="text-gray-400 text-sm mt-2 max-w-xl">Explora a filmografia e abre os detalhes de cada título.</p>
                </div>
                <!-- links movidos para a navbar -->
            </div>
            <div class="mt-8 flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between text-xs text-gray-500">
                <span>© <span id="footerYear"></span> CinePIS</span>
                <div class="flex flex-col sm:flex-row gap-2 sm:items-center">
                    <span>Feito com Tailwind CSS • Dados: TMDB</span>
                    <span class="text-gray-600">|</span>
                    <span>Desenvolvido por David Fernandes & João Rôlo & Sorin Revenco</span>
                </div>
            </div>
        </div>
        <script>document.getElementById('footerYear') && (document.getElementById('footerYear').textContent = new Date().getFullYear());</script>
    </footer>
</body>
</html>
