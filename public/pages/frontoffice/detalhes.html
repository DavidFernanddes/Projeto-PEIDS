<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes - PIS</title>
    <!-- ATENÇÃO AOS CAMINHOS: ../../ para voltar à raiz do public -->
    <link rel="stylesheet" href="../../css/global.css">
    <style>
        /* CSS Específico desta página */
        body { font-family: sans-serif; background: #222; color: white; padding: 20px; }
        .container { 
            max-width: 900px; 
            margin: 40px auto; 
            background: #333; 
            padding: 30px; 
            border-radius: 10px; 
            display: flex; 
            gap: 30px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .poster-container img { 
            width: 300px; 
            border-radius: 10px; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .info { flex: 1; display: flex; flex-direction: column; justify-content: center;}
        h1 { margin-top: 0; color: #f4c10f; font-size: 2.5rem; margin-bottom: 10px; }
        .meta { color: #aaa; margin-bottom: 20px; font-size: 0.9rem; }
        .rating { font-size: 1.2rem; margin-bottom: 20px; color: #fff; }
        .rating span { color: #f4c10f; font-weight: bold; }
        .sinopse { line-height: 1.6; color: #ddd; margin-bottom: 30px; }
        
        .btn { 
            display: inline-block; 
            padding: 12px 25px; 
            background: #007bff; 
            color: white; 
            text-decoration: none; 
            border-radius: 5px; 
            font-weight: bold;
            text-align: center;
            width: fit-content;
            transition: background 0.3s;
        }
        .btn:hover { background: #0056b3; }

        /* Responsivo para telemóvel */
        @media (max-width: 700px) {
            .container { flex-direction: column; align-items: center; }
            .info { text-align: center; align-items: center; }
        }
    </style>
</head>
<body>

    <div id="loading" style="text-align: center; margin-top: 50px;">A carregar filme...</div>
    
    <div id="filme-detalhe" class="container" style="display: none;">
        <!-- Imagem à esquerda -->
        <div class="poster-container">
            <img id="poster" src="" alt="Poster">
        </div>
        
        <!-- Texto à direita -->
        <div class="info">
            <h1 id="titulo">Titulo do Filme</h1>
            
            <div class="meta">
                Lançado em: <span id="data"></span> | Tipo: <span id="tipo"></span>
            </div>

            <div class="rating">
                Classificação: <span>⭐ <span id="nota"></span>/10</span>
            </div>

            <p id="sinopse">A sinopse vai aqui...</p>
            
            <!-- Botão para voltar ao início -->
            <a href="/" class="btn">⬅ Voltar à Lista</a>
        </div>
    </div>

    <script>
        // Lógica simples apenas para esta página
        async function carregarDetalhes() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            if (!id) {
                document.body.innerHTML = '<h1 style="text-align:center; margin-top:50px">Erro: Nenhum filme selecionado</h1>';
                return;
            }

            try {
                // O fetch funciona na mesma porque o /api é absoluto
                const res = await fetch(`/api/filmes/${id}`);
                
                if (!res.ok) throw new Error('Filme não encontrado');
                
                const filme = await res.json();

                // Preencher dados
                document.getElementById('titulo').innerText = filme.title;
                document.getElementById('sinopse').innerText = filme.synopsis || "Sem sinopse disponível.";
                document.getElementById('data').innerText = filme.release_date ? new Date(filme.release_date).toLocaleDateString() : 'N/A';
                document.getElementById('nota').innerText = filme.vote_average;
                document.getElementById('tipo').innerText = filme.type === 'movie' ? 'Filme' : 'Série';
                
                const imagem = filme.poster_path ? filme.poster_path : 'https://via.placeholder.com/300x450?text=Sem+Poster';
                document.getElementById('poster').src = imagem;

                // Mostrar
                document.getElementById('loading').style.display = 'none';
                document.getElementById('filme-detalhe').style.display = 'flex';

            } catch (erro) {
                document.body.innerHTML = `<h1 style="text-align:center">Erro: ${erro.message}</h1>`;
            }
        }

        carregarDetalhes();
    </script>
</body>
</html>
