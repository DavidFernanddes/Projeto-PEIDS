<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do Filme</title>
    <link rel="stylesheet" href="../../css/global.css">
    <style>
        body { font-family: sans-serif; background-color: #121212; margin: 0; color: #e0e0e0; }
        
        /* Navbar */
        nav { background: #000; padding: 15px; border-bottom: 1px solid #333; }
        nav a { color: white; text-decoration: none; font-weight: bold; }

        /* Container Principal */
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }

        /* Info do Filme */
        #filme-info { 
            display: flex; 
            gap: 30px; 
            background: #1f1f1f; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        #poster { width: 250px; border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.3); }
        h1 { margin-top: 0; color: #fff; }
        
        /* Botão Favoritos */
        #btnFav {
            margin-top: 15px;
            padding: 10px 20px;
            background: transparent;
            border: 2px solid #e50914;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
        }
        #btnFav:hover { background: rgba(229, 9, 20, 0.1); }

        /* Reviews */
        .review-section { margin-top: 40px; background: #fff; color: #333; padding: 25px; border-radius: 8px; }
        .review-card { border-bottom: 1px solid #eee; padding: 15px 0; }
        .review-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px;}
        .stars { color: #f4c10f; }
        
        .utility-btn { 
            background: #f0f0f0; 
            border: 1px solid #ccc; 
            padding: 5px 12px; 
            cursor: pointer; 
            border-radius: 4px; 
            font-size: 0.8rem; 
            margin-top: 5px;
        }
        .utility-btn:hover { background: #e0e0e0; }

        /* Formulário */
        #form-review-container { background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 20px;}
        input, textarea { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button[type="submit"] { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
        button[type="submit"]:hover { background: #0056b3; }
    </style>
</head>
<body>
    <nav>
        <a href="/">⬅ Voltar à Home</a>
    </nav>

    <div class="container">
        <div id="filme-info">
            <img id="poster" src="" alt="Poster">
            <div style="flex: 1;">
                <h1 id="titulo">Carregando...</h1>
                <p id="sinopse" style="line-height: 1.6; color: #bbb;"></p>
                <p><strong>Lançamento:</strong> <span id="data"></span></p>
                <p><strong>Rating Geral:</strong> ⭐ <span id="rating"></span></p>
                
                <button id="btnFav" onclick="toggleFav()" style="display: none;">
                    🤍 Adicionar aos Favoritos
                </button>
            </div>
        </div>

        <div class="review-section">
            <h2>📝 Reviews & Críticas</h2>
            
            <div id="login-warning" style="display: none; color: #555; background: #eee; padding: 15px; border-radius: 5px;">
                🔒 <a href="/pages/auth/login.html" style="color: #007bff; font-weight: bold;">Faz login</a> para escreveres reviews ou marcar favoritos.
            </div>

            <div id="form-review-container" style="display: none;">
                <h3 style="margin-top: 0;">Deixa a tua opinião</h3>
                <form id="reviewForm">
                    <label>Classificação (1-10):</label>
                    <input type="number" id="userRating" min="1" max="10" required style="width: 60px;">
                    <br><br>
                    <label>Comentário:</label><br>
                    <textarea id="userComment" rows="3" style="width: 100%; box-sizing: border-box;" required></textarea>
                    <br><br>
                    <button type="submit">Publicar Review</button>
                </form>
            </div>

            <div id="lista-reviews">
                <p>A carregar reviews...</p>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const idFilme = params.get('id');

        // Função Principal
        async function carregarPagina() {
            if(!idFilme) return alert('ID não fornecido');

            // 1. Verificar Token no LocalStorage
            const token = localStorage.getItem('token');
            const isLoggedIn = !!token; // Converte para boolean (true se existir token)

            // Mostrar/Esconder elementos baseados no login
            if (isLoggedIn) {
                document.getElementById('form-review-container').style.display = 'block';
                document.getElementById('btnFav').style.display = 'inline-block';
            } else {
                document.getElementById('login-warning').style.display = 'block';
            }

            // 2. Carregar Dados do Filme (Público)
            try {
                const res = await fetch(`/api/filmes/${idFilme}`);
                if (!res.ok) throw new Error("Filme não encontrado");
                
                const dados = await res.json();
                
                // Preencher HTML
                document.getElementById('titulo').innerText = dados.title;
                document.getElementById('sinopse').innerText = dados.synopsis || "Sem sinopse.";
                document.getElementById('data').innerText = dados.release_date ? new Date(dados.release_date).toLocaleDateString('pt-PT') : 'N/A';
                document.getElementById('rating').innerText = Number(dados.vote_average).toFixed(1);
                document.getElementById('poster').src = dados.poster_path;

                // 3. Se estiver logado, verificar se é favorito
                if (isLoggedIn) {
                    verificarSeEFavorito(token);
                }

                // 4. Carregar Reviews
                renderizarReviews(dados.reviews, isLoggedIn);

            } catch (erro) {
                document.body.innerHTML = `<h1 style="color:white; text-align:center; margin-top:50px">${erro.message}</h1>`;
            }
        }

        // Renderizar lista de reviews
        function renderizarReviews(reviews, isLoggedIn) {
            const lista = document.getElementById('lista-reviews');
            lista.innerHTML = '';

            if (!reviews || reviews.length === 0) {
                lista.innerHTML = '<p>Ainda não há reviews. Sê o primeiro!</p>';
                return;
            }

            reviews.forEach(r => {
                const div = document.createElement('div');
                div.className = 'review-card';
                div.innerHTML = `
                    <div class="review-header">
                        <span>👤 ${r.user_name}</span>
                        <span class="stars">⭐ ${r.rating}/10</span>
                    </div>
                    <p>${r.comment}</p>
                    <small style="color: #666;">Útil: <span id="count-${r.id}">${r.utility_counter}</span> pessoas acharam útil</small>
                    ${isLoggedIn ? `<br><button class="utility-btn" onclick="votarUtil(${r.id})">👍 Isto é útil</button>` : ''}
                `;
                lista.appendChild(div);
            });
        }

        // --- FUNCIONALIDADE FAVORITOS (JWT) ---
        async function verificarSeEFavorito(token) {
            try {
                const res = await fetch(`/api/favorites/check/${idFilme}`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                atualizarBotaoVisual(data.isFavorite);
            } catch (e) { console.error("Erro favorito:", e); }
        }

        async function toggleFav() {
            const token = localStorage.getItem('token');
            if(!token) return window.location.href = '/pages/auth/login.html';

            const res = await fetch('/api/favorites/toggle', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token // Token JWT
                },
                body: JSON.stringify({ contentId: idFilme })
            });

            if (res.ok) {
                const data = await res.json();
                atualizarBotaoVisual(data.isFavorite);
            } else {
                alert('Sessão expirada. Faz login novamente.');
            }
        }

        function atualizarBotaoVisual(isFav) {
            const btn = document.getElementById('btnFav');
            if (isFav) {
                btn.innerHTML = '❤️ Remover dos Favoritos';
                btn.style.backgroundColor = '#e50914';
                btn.style.borderColor = '#e50914';
            } else {
                btn.innerHTML = '🤍 Adicionar aos Favoritos';
                btn.style.backgroundColor = 'transparent';
                btn.style.borderColor = '#e50914';
            }
        }

        // --- FUNCIONALIDADE REVIEWS (JWT) ---
        document.getElementById('reviewForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = localStorage.getItem('token');
            if(!token) return alert('Tens de estar logado!');

            const rating = document.getElementById('userRating').value;
            const comment = document.getElementById('userComment').value;

            const res = await fetch('/api/reviews', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token // Token JWT
                },
                body: JSON.stringify({ content_id: idFilme, rating, comment })
            });

            const resposta = await res.json();

            if (res.ok) {
                alert('Obrigado pela tua review!');
                location.reload();
            } else {
                alert('Erro: ' + resposta.error);
            }
        });

        // --- FUNCIONALIDADE VOTAR ÚTIL (JWT) ---
        async function votarUtil(reviewId) {
            const token = localStorage.getItem('token');
            if(!token) return alert('Login necessário');

            const res = await fetch(`/api/reviews/${reviewId}/vote`, { 
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token } // Token JWT
            });
            
            if (res.ok) {
                alert('Voto registado!');
                const span = document.getElementById(`count-${reviewId}`);
                span.innerText = parseInt(span.innerText) + 1;
            } else {
                const err = await res.json();
                alert(err.error);
            }
        }

        // Iniciar tudo
        carregarPagina();
    </script>
</body>
</html>
